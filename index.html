    const ct = Uint8Array.from(atob(ENC.ct), c => c.charCodeAt(0));
    const tag = Uint8Array.from(atob(ENC.tag), c => c.charCodeAt(0));
    const bundle = new Uint8Array(ct.length + tag.length);
    bundle.set(ct, 0); bundle.set(tag, ct.length);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, bundle);
    document.getElementById("content").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("content").style.display = "block";
    document.getElementById("gate").style.display = "none";
  } catch (e) {
    err.textContent = "Wrong passphrase, or content corrupted.";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
</script>
