async function derive(pw, saltB64, iters) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations: iters, hash:"SHA-256"}, mat, 256);
  return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
}
async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const key = await derive(pw, ENC.salt, ENC.iters);
    const iv = Uint8Array.from(atob(ENC.iv), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(ENC.ct), c => c.charCodeAt(0));
    const tag = Uint8Array.from(atob(ENC.tag), c => c.charCodeAt(0));
    const bundle = new Uint8Array(ct.length + tag.length);
    bundle.set(ct, 0); bundle.set(tag, ct.length);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, bundle);
    document.getElementById("content").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("content").style.display = "block";
    document.getElementById("gate").style.display = "none";
  } catch (e) {
    err.textContent = "Wrong passphrase, or content corrupted.";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
